[project]
name = "rut-validator"
version = "1.0.0"
description = "Framework-agnostic Chilean RUT validation with optional ORM adapters"
authors = [
    {name = "Eli-ezer Reuven Ramirez Ruiz", email = "ramirez.ruiz.eliezer.reuven@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
keywords = ["rut", "chile", "validation", "pydantic", "django", "sqlalchemy", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click (>=8.0.0,<9.0.0)"
]

[project.optional-dependencies]
pydantic = ["pydantic (>=2.6,<3.0)"]
sqlalchemy = ["sqlalchemy (>=2.0,<3.0)"]
django = ["django (>=4.2,<6.0)"]
sqlmodel = [
    "sqlmodel (>=0.0.22,<1.0)",
    "pydantic (>=2.6,<3.0)",
    "sqlalchemy (>=2.0,<3.0)",
]
fastapi = ["fastapi (>=0.141.1,<1.0.0)"]
all = [
    "pydantic (>=2.6,<3.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "django (>=4.2,<6.0)",
    "sqlmodel (>=0.0.22,<1.0)",
    "fastapi (>=0.141.1,<1.0.0)",
]
dev = [
    "pytest (>=7.0.0)",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "ruff",
    "mypy",
    "pre-commit",
    "hypothesis (>=6.161.8,<7)",
    "httpx (>=0.27,<1.0)",
    "pydantic (>=2.6,<3.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "django (>=4.2,<6.0)",
    "sqlmodel (>=0.0.22,<1.0)",
]
docs = [
    "mkdocs (>=1.6,<2.0)",
    "mkdocs-material (>=9.6,<10.0)",
]

[project.scripts]
rut-validator = "rut_validator.cli:cli"

[project.urls]
Homepage = "https://github.com/ezer-mackenzie/rut-validator"
Documentation = "https://rut-validator.readthedocs.io/"
Repository = "https://github.com/ezer-mackenzie/rut-validator"
Issues = "https://github.com/ezer-mackenzie/rut-validator/issues"
Changelog = "https://github.com/ezer-mackenzie/rut-validator/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "rut_validator", from = "src"}]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["rut_validator"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "django.*",
    "sqlalchemy.*",
    "fastapi.*",
    "sqlmodel.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["src/rut_validator"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py"
]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
