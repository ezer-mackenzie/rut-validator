name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify_ci:
    name: Verify release commit
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release commit
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Require successful CI for release commit
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CI_RUN_ID=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --limit 10 --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId')
          test -n "$CI_RUN_ID"
          echo "run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

  pypi-publish:
    name: Upload to PyPI
    needs: verify_ci
    runs-on: ubuntu-latest

    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download distributions validated by CI
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.verify_ci.outputs.run_id }}

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
