name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_run:
    workflows: ["CI"] # Debe coincidir exactamente con el "name:" de tu archivo ci.yml
    types:
      - completed

jobs:
  pypi-publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest

    # IMPORTANT: only run this job if the CI workflow succeeded and was triggered by a user (not a bot)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.triggering_actor != '' }} 

    environment: pypi
    permissions:
      id-token: write # Necesario para la publicación confiable
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
