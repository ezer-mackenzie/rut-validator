name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: pytest --cov=rut_validator --cov-report=term-missing
      - name: Generate Codecov XML
        if: matrix.python-version == '3.14'
        run: coverage xml -o coverage.xml
      - name: Store Codecov report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  isolated-extra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pydantic
            tests: tests/integrations/pydantic/test_pydantic.py
            support: ""
          - extra: fastapi
            tests: tests/integrations/pydantic/test_fastapi.py
            support: httpx
          - extra: django
            tests: tests/integrations/django
            support: ""
          - extra: sqlalchemy
            tests: tests/integrations/sqlalchemy
            support: ""
          - extra: sqlmodel
            tests: tests/integrations/sqlmodel
            support: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated integration
        run: python -m pip install ".[${{ matrix.extra }}]" pytest ${{ matrix.support }}
      - run: pytest ${{ matrix.tests }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,docs]" build poetry twine pip-audit
      - run: poetry check
      - run: ruff check src tests examples
      - run: black --check src tests examples
      - run: mypy src/rut_validator tests/typing
      - run: mkdocs build --strict
      - run: python examples/01_pure_validation.py
      - run: python examples/02_pydantic_usage.py
      - run: python examples/05_sqlmodel_usage.py
      - name: Audit declared base dependencies
        run: pip-audit .
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/rut-validator-wheel
          /tmp/rut-validator-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/rut-validator-wheel/bin/python -c "import rut_validator; assert rut_validator.is_valid_rut('12.345.678-5')"
      - name: Store validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        run: |
          cd /tmp
          python -c "import rut_validator; assert rut_validator.validate_rut('12.345.678-5').normalized == '123456785'"
          rut-validator validate 12.345.678-5 --json
