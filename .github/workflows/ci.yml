name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test integrations
        run: python -m pip install ".[dev]"
      - name: Test
        run: pytest --cov=rut_validator --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev,docs]" build twine
      - run: ruff check src tests examples
      - run: black --check src tests examples
      - run: mypy src/rut_validator
      - run: mkdocs build --strict
      - run: python -m build
      - run: twine check dist/*
