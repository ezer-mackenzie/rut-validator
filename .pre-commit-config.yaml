repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src/rut_validator
        language: system
        pass_filenames: false
        types: [python]
      - id: mkdocs
        name: mkdocs
        entry: mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml)
