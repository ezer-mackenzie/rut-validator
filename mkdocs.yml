site_name: rut-validator
site_description: Chilean RUT validation for Python and modern frameworks
site_url: https://rut-validator.readthedocs.io/
repo_url: https://github.com/ezer-mackenzie/rut-validator
repo_name: ezer-mackenzie/rut-validator
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Core API: core.md
  - CLI: cli.md
  - Integrations:
      - Pydantic and FastAPI: pydantic-fastapi.md
      - SQLAlchemy and SQLModel: sqlalchemy-sqlmodel.md
      - Django: django.md
  - API reference: api-reference.md
  - Development: development.md
  - Versioning and releases: release-policy.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
