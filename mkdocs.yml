site_name: rut-validator
site_description: Validación de RUT chileno para Python y frameworks modernos
site_url: https://rut-validator.readthedocs.io/
repo_url: https://github.com/ezer-mackenzie/rut-validator
repo_name: ezer-mackenzie/rut-validator
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Usar tema oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - Core: core.md
  - CLI: cli.md
  - Integraciones:
      - Pydantic y FastAPI: pydantic-fastapi.md
      - SQLAlchemy y SQLModel: sqlalchemy-sqlmodel.md
      - Django: django.md
  - Referencia de API: api-reference.md
  - Desarrollo: development.md
  - Versionado y releases: release-policy.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
